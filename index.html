<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Important for mobile -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

    <meta name="theme-color" content="#030511">

    <title>TECHNOVA 1.0</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Animated Neural Network -->
    <canvas id="networkCanvas"></canvas>

    <!-- Background effects -->
    <div class="background-glow"></div>
    <div class="noise"></div>

    <!-- Top decoration -->
    <div class="top-line"></div>

    <main class="hero">

        <section class="hero-content">

            <!-- Welcome -->
            <div class="welcome-wrapper">

                <span class="welcome-line"></span>

                <p class="welcome">
                    WELCOME TO THE NEXT WAVE OF INNOVATION
                </p>

                <span class="welcome-line"></span>

            </div>


            <!-- Main Title -->
            <div class="title-container">

                <h1 class="title" data-text="TECHNOVA">
                    TECHNOVA
                </h1>

                <div class="version">

                    <span></span>

                    <strong>1.0</strong>

                    <span></span>

                </div>

            </div>


            <!-- Tagline -->
            <h2 class="tagline">

                <span>Think Beyond.</span>
                <span>Build Bold.</span>
                <span>Compete Smart.</span>

            </h2>


            <!-- Description -->
            <p class="description">
                Where technology meets creativity and ideas turn into experiences.
                Challenge your skills across
                <strong>AI, coding, design and innovation.</strong>
            </p>


            <!-- Button -->
            <button id="enterBtn" class="enter-btn">

                <span class="button-text">
                    ENTER TECHNOVA
                </span>

                <span class="button-arrow">
                    →
                </span>

            </button>


            <!-- Bottom indicator -->
            <div class="system-status">

                <span class="status-dot"></span>

                <span>
                    REGISTRATION PORTAL ACTIVE
                </span>

            </div>

        </section>

    </main>


    <!-- Corner decorations -->

    <div class="corner top-left"></div>
    <div class="corner top-right"></div>

    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>


    <script src="js/script.js"></script>

</body>
</html>
